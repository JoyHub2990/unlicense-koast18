name: spike2

# Spike 2 — Stage 0 of the whatlicense pipeline (find `lic_copy`) ported to
# the Frida stack. Runs three things on windows-2022:
#   1. build wl-lic (dummy license generator) and produce the dummy license
#   2. the local mimic target (fast sanity check of the agent on this runner)
#   3. the real samples with the NtCreateFile redirect + MapViewOfFile /
#      UnmapViewOfFile hooks, i.e. the actual Stage 0 question.

on:
  workflow_dispatch:
    inputs:
      samples:
        description: "Also run the real samples (known CI dead end, ~12 min of the x86 leg)"
        type: boolean
        default: false
      samples_lists:
        description: "Manifest(s) to prepare, colon separated (tests/*.list)"
        type: string
        default: "tests/samples.list"
      targets_x86:
        description: "Override the x86 target labels (comma separated)"
        type: string
        default: ""
      targets_x64:
        description: "Override the x64 target labels (comma separated)"
        type: string
        default: ""
      repeat:
        description: "Run each target this many times (the landmark is a flaky ~15% event)"
        type: string
        default: "1"
      stop_after_hits:
        description: "Stop a target's attempts after N Stage 1 completions (0 = run them all)"
        type: string
        default: "0"
      stop_after_stage2:
        description: "Stop a target's attempts after N Stage 2 results, i.e. bypass/complete (0 = run them all)"
        type: string
        default: "0"
      duration:
        description: "Seconds per attempt. The landmark, when it happens, shows up within ~45s; a longer window only buys dead time."
        type: string
        default: "90"
      modes_x86:
        description: "x86 modes: normal,deferred. x86 normal is a proven dead weight (12/12 runs never reached the license)."
        type: string
        default: "deferred"
      modes_x64:
        description: "x64 modes: normal,deferred"
        type: string
        default: "normal,deferred"
  push:
    branches: [main, dev]
    paths:
      - "spikes/**"
      - ".github/workflows/spike2.yml"

concurrency:
  # Include the event and the run's own configuration: a push-triggered sanity
  # run must not cancel a dispatched real-sample run (and two dispatches with
  # different targets are genuinely different work). Re-running the *same*
  # configuration still cancels the older attempt, which is the point.
  group: spike2-${{ github.ref }}-${{ github.event_name }}-${{ inputs.targets_x86 }}-${{ inputs.targets_x64 }}-${{ inputs.modes_x64 }}
  cancel-in-progress: true

env:
  SAMPLES_LISTS: ${{ inputs.samples_lists || 'tests/samples.list' }}

jobs:
  stage0:
    strategy:
      fail-fast: false
      matrix:
        # The interpreter width must match the target's (same rule as
        # unlicense's interpreter_can_dump_pe). Which samples are worth
        # trying depends on the bitness: whatlicense's own sample and the
        # x86 Themida/WinLicense ones on x86, and the two targets the
        # upstream probe left as "OEP timeout" (i.e. license-gated) on x64.
        include:
          - python_arch: x86
            # vc_example/ragexe are Themida + anti-analysis probes and never
            # touch regkey.dat, so Stage 1 was only ever exercised on x64.
            # x86 is the primary target platform, so the x86 leg also runs the
            # two x86 v3 samples that plausibly are license-gated; the run
            # report's openedPaths decides which of them actually are.
            targets: "whatlic_sample,vc_example,ragexe,get1,davethediver72"
          - python_arch: x64
            targets: "drchost,target51,test84"
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python_arch }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Exclude workspace from Windows Defender
        shell: pwsh
        run: |
          try { Add-MpPreference -ExclusionPath 'D:\a' -ErrorAction Stop; Write-Host 'exclusion added' }
          catch { Write-Host "exclusion failed: $_" }

      - name: Install frida
        run: |
          python -m pip install --upgrade pip
          pip install "frida==16.1.3"

      # prepare_samples.py classifies PEs with the package's own lief-based
      # helpers, so the package itself has to be installed (this is what
      # unpack.yml / probe.yml do in their "Install package" step).
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install .

      # Best effort: MSVC covers everything the spikes build, and the stub
      # builder falls back to it. mingw is still preferred where decorated
      # symbol names matter, and install_mingw.py now has a pinned-asset
      # fallback for the rate-limited release API.
      # Required on x86: MSVC fails there with "The filename, directory name, or
      # volume label syntax is incorrect." (32-bit python driving vcvarsall on
      # 64-bit Windows), so mingw is the only working toolchain for that leg.
      # Gating this behind the samples input silently broke the whole x86 leg.
      - name: Fetch mingw-w64 for this architecture
        continue-on-error: true
        run: python scripts/install_mingw.py

      # Everything the job needs must exist by the time the real steps run,
      # so the toolchains are installed/verified here rather than discovered
      # halfway through. windows-2022 ships Visual Studio; mingw is fetched
      # by the step above (and is what the stub builder already relies on).
      - name: Toolchain check
        shell: pwsh
        run: |
          Write-Host "python: $(python -c 'import sys;print(sys.version, sys.maxsize > 2**32)')"
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          Write-Host "visual studio: $vs"
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvarsall.bat"
          Write-Host "vcvarsall: $vcvars exists=$(Test-Path $vcvars)"
          Get-ChildItem -Path tools\mingw -Recurse -Filter *-gcc.exe -ErrorAction SilentlyContinue | Select-Object -First 4 FullName | ForEach-Object { Write-Host "mingw gcc: $($_.FullName)" }
          Get-ChildItem -Path tools\mingw -Recurse -Filter *-g++.exe -ErrorAction SilentlyContinue | Select-Object -First 4 FullName | ForEach-Object { Write-Host "mingw g++: $($_.FullName)" }
          Write-Host "frida: $(python -c 'import frida;print(frida.__version__)')"

      # wl-lic is not part of the unlicense fork; it is the whatlicense
      # author's standalone tool (see references/whatlicense-stage-map.md).
      # Fetch ladder: git first, codeload tarball as the fallback.
      - name: Fetch whatlicense (wl-lic sources)
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/ret2vibec/whatlicense.git whatlicense
          if (-not (Test-Path whatlicense\wl-lic\main.cpp)) {
            Write-Host "clone did not produce wl-lic, trying codeload"
            curl.exe -sL -o wl.tgz https://codeload.github.com/ret2vibec/whatlicense/tar.gz/refs/heads/main
            New-Item -ItemType Directory -Force -Path whatlicense | Out-Null
            tar.exe xzf wl.tgz --strip-components=1 -C whatlicense
          }
          if (-not (Test-Path whatlicense\wl-lic\main.cpp)) { throw "wl-lic sources unavailable" }
          Write-Host "wl-lic sources: $((Get-ChildItem whatlicense\wl-lic\*.cpp).Count) cpp files"

      - name: Build wl-lic and generate the dummy license
        continue-on-error: true
        env:
          WLIC_DIR: ${{ github.workspace }}\whatlicense
        run: python spikes/build_wl_lic.py

      - name: Spike 2 on the local mimic target (agent sanity check)
        continue-on-error: true
        run: python spikes/run_spike2.py --local --opts 0 --duration 25

      # Loud failure when the local run never happened. continue-on-error on the
      # step above plus if-no-files-found: ignore on the upload silently dropped
      # a whole architecture: the x86 leg lost its mingw toolchain, both the
      # wl-lic build and the mimic run died in 0.5s, and the run still reported
      # success with only the x64 artifact.
      - name: Assert the local run produced a result
        shell: pwsh
        run: |
          $f = "results/spike2_local_win32_${{ matrix.python_arch }}.json"
          if (-not (Test-Path $f)) { throw "missing $f -- the local agent run did not happen" }
          Write-Host "local result: $f ($((Get-Item $f).Length) bytes)"

      - name: Prepare samples and stub DLLs
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.samples }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SAMPLES_TOKEN }}
        run: |
          if ("${{ env.SAMPLES_LISTS }}".Contains("crypt")) {
            if (-not $env:GH_TOKEN) { throw "SAMPLES_TOKEN secret is not set" }
            gh release download samples-vpi --repo koast18/wl-samples --dir samples/dl --clobber
          }
          python scripts/prepare_samples.py
          python scripts/stub_missing_dlls.py
          python -c "import json;m=json.load(open('results/manifest.json'));print('manifest:',len(m),'entries,',sum(1 for e in m if e['downloaded']),'downloaded')"
          Test-Path results/manifest.json

      - name: Spike 2 against real samples (Stage 0)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.samples && contains((matrix.python_arch == 'x86' && inputs.modes_x86) || (matrix.python_arch == 'x64' && inputs.modes_x64) || 'deferred', 'normal') }}
        continue-on-error: true
        run: python spikes/run_spike2.py --ci --repeat ${{ inputs.repeat || 1 }} --dummy results/spike2_dummy/regkey.dat --targets ${{ (matrix.python_arch == 'x86' && inputs.targets_x86) || (matrix.python_arch == 'x64' && inputs.targets_x64) || matrix.targets }} --duration ${{ inputs.duration || 90 }}

      # Same samples, same agent, but Stalker is not started until the license
      # file is mapped. Stalker costs ~100x, so with it on from the start the
      # protection's own unpacking crawls; a frozen byte-store counter on
      # ngahost/drchostvpi is the symptom. This is the mode that actually
      # reaches the license on x86, so it is x86's default.
      - name: Spike 2 against real samples (deferred tracing)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.samples && contains((matrix.python_arch == 'x86' && inputs.modes_x86) || (matrix.python_arch == 'x64' && inputs.modes_x64) || 'deferred', 'deferred') }}
        continue-on-error: true
        env:
          # A real sample calls the RSA routine once and then gives up, so
          # whatlicense's dec_sections + 1 completion count is never reached
          # (ngahost#9: swap call#1 and no call#2). End Stage 1 on that first
          # call, with the swapped key in place, so Stage 2 gets to run.
          STAGE1_COMPLETE_AFTER: "1"
        run: python spikes/run_spike2.py --ci --defer-tracing --repeat ${{ inputs.repeat || 1 }} --stop-after-hits ${{ inputs.stop_after_hits || 0 }} --stop-after-stage2 ${{ inputs.stop_after_stage2 || 0 }} --dummy results/spike2_dummy/regkey.dat --targets ${{ (matrix.python_arch == 'x86' && inputs.targets_x86) || (matrix.python_arch == 'x64' && inputs.targets_x64) || matrix.targets }} --duration ${{ inputs.duration || 90 }}

      - name: Upload spike 2 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike2-results-${{ matrix.python_arch }}
          path: |
            results/
          if-no-files-found: ignore
          retention-days: 14
