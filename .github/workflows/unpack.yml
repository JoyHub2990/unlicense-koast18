name: unpack

on:
  workflow_dispatch:
    inputs:
      samples_lists:
        description: "Manifest(s) to prepare, colon separated (tests/*.list)"
        type: string
        default: "tests/samples.list"
      guard:
        description: "1 = neutralize the licence check inside the unpacking session (UNLICENSE_GUARD=1)"
        type: string
        default: "0"
      skip_oep:
        description: "1 = diagnostic: do not arm the OEP tracer, to attribute a stall to it"
        type: string
        default: "0"
      attempts:
        description: "Attempts per sample when the guard is on (each is a full run)"
        type: string
        default: "3"
  # Dispatch only. This workflow runs the whole sample manifest (up to 90
  # minutes of windows runner per leg) and holds the concurrency group, so a push
  # to unlicense/** used to queue a full run behind every small commit and block
  # a dispatched run that was actually wanted. spikes/check.yml cover pushes.

concurrency:
  group: unpack-${{ github.ref }}
  cancel-in-progress: true

env:
  SAMPLES_LISTS: ${{ inputs.samples_lists || 'tests/samples.list' }}
  UNLICENSE_GUARD: ${{ inputs.guard || '0' }}
  UNLICENSE_GUARD_SKIP_OEP: ${{ inputs.skip_oep || '0' }}
  UNLICENSE_GUARD_ATTEMPTS: ${{ inputs.attempts || '8' }}

jobs:
  unpack:
    # Bitness of the interpreter must match the target PE
    # (interpreter_can_dump_pe), so run both architectures.
    strategy:
      fail-fast: false
      matrix:
        python_arch: [x86, x64]
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python_arch }}

      # Themida-protected test binaries are often flagged by Defender, which
      # kills them mid-injection ("refused to load frida-agent").
      - name: Exclude workspace from Windows Defender
        shell: pwsh
        run: |
          try { Add-MpPreference -ExclusionPath 'D:\a' -ErrorAction Stop; Write-Host 'exclusion added' }
          catch { Write-Host "exclusion failed: $_" }

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Fetch mingw-w64 for this architecture (exports stdcall names verbatim)
        run: python scripts/install_mingw.py

      - name: Fetch the private sample release (crypt set)
        if: contains(env.SAMPLES_LISTS, 'crypt')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.SAMPLES_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) { throw "SAMPLES_TOKEN secret is not set" }
          gh release download samples-vpi --repo koast18/wl-samples --dir samples/dl --clobber
          Get-ChildItem samples/dl | ForEach-Object { Write-Host "$($_.Name) $($_.Length)" }

      - name: Prepare samples (download + extract + classify)
        run: python scripts/prepare_samples.py

      - name: Stub missing runtime DLLs
        run: python scripts/stub_missing_dlls.py

      # wl-lic is not part of the unlicense fork; it is the whatlicense author's
      # standalone tool.  The guard needs its output twice over: the dummy licence
      # to redirect the protection's read to, and the RSA keys Stage 1 matches the
      # protection's mp_exptmod arguments against.  Without the keys the matcher
      # reports sub4-no-key-match ... rsaKeys=null and Stage 1 never completes.
      - name: Fetch whatlicense (wl-lic sources)
        if: env.UNLICENSE_GUARD == '1'
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/ret2vibec/whatlicense.git whatlicense
          if (-not (Test-Path whatlicense\wl-lic\main.cpp)) {
            Write-Host "clone did not produce wl-lic, trying codeload"
            curl.exe -sL -o wl.tgz https://codeload.github.com/ret2vibec/whatlicense/tar.gz/refs/heads/main
            New-Item -ItemType Directory -Force -Path whatlicense | Out-Null
            tar.exe xzf wl.tgz --strip-components=1 -C whatlicense
          }
          if (-not (Test-Path whatlicense\wl-lic\main.cpp)) { throw "wl-lic sources unavailable" }

      - name: Build wl-lic and generate the dummy license
        if: env.UNLICENSE_GUARD == '1'
        env:
          WLIC_DIR: ${{ github.workspace }}\whatlicense
        run: python spikes/build_wl_lic.py

      - name: Place the dummy licence and keys next to each sample (guard)
        if: env.UNLICENSE_GUARD == '1'
        run: python scripts/make_dummy_licenses.py

      - name: Unpack samples
        run: python scripts/run_unpack.py

      - name: Verify dumps (static + run)
        if: always()
        continue-on-error: true
        run: python scripts/verify_dumps.py

      - name: Upload dumps, logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unpack-results-${{ matrix.python_arch }}
          path: |
            results/
          if-no-files-found: ignore
          retention-days: 14
